# ------------------------------------------------------------------
# Netlify config — static site, no build step.
# Reusable security baseline: copy this file into any static project
# and adjust the Content-Security-Policy to the domains that site needs.
# ------------------------------------------------------------------

[build]
  publish = "public"
  command = ""

# ---------- Rate limiting (works on all plans, max 2 rules on Free) ----------
# Per-IP limit across the whole site. A normal page view here is ~6 requests,
# so 120/minute leaves room for real visitors (incl. shared office IPs) while
# cutting off a single abusive client. Over the limit -> friendly page.
# Check the deploy log ("Post-processing") to confirm the rule was accepted.
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
  [redirects.rate_limit]
    action = "rewrite"
    to = "/rate-limited.html"
    window_limit = 120
    window_size = 60
    aggregate_by = ["ip", "domain"]

# ---------- Security headers (every response) ----------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

# ---------- Caching ----------
# Fonts never change: cache for a year.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS: cache a day, revalidate after (no fingerprinting build step here).
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
